name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 팀 확정 사항: Java 26 (settings.gradle의 foojay resolver와 버전 일치)
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      # 실패 시 어느 테스트가 깨졌는지 바로 보이도록 리포트를 남긴다
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
